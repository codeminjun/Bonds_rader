name: Leverage Risk Monitor

on:
  schedule:
    # 일간 브리핑: 평일 밤 10시 KST = UTC 13:00 (미국 ET 08:00, SOFR 발표 후 + 장 개장 전)
    - cron: '0 13 * * 1-5'
    # 장마감 업데이트: 평일 아침 7시 KST = UTC 22:00 전일 (미국 ET 17:00, 장마감 후)
    - cron: '0 22 * * 1-5'
    # 주간 리포트: 토요일 오전 10시 KST = UTC 01:00
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (daily / update / weekly)'
        required: false
        default: 'daily'

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ -n "$RUN_MODE" ]; then
            python run_local.py "$RUN_MODE"
          else
            python -c "from src.main import main; main()"
          fi

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: update $(date -u +%Y-%m-%d)"
          git push
